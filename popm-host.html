<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host a Live Game — SAFe POPM Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap');
  :root{--bg:#1a1a2e;--surface:#16213e;--card:#0f3460;--accent:#e94560;--yellow:#f5a623;--green:#2ecc71;--red:#e74c3c;--muted:#a0aec0;--white:#fff;--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;--a:#e21b3c;--b:#1368ce;--c:#26890c;--d:#ffa602}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden}
  h1,h2,h3,.n{font-family:'Nunito',sans-serif}
  .screen{display:none;min-height:100vh}
  .screen.active{display:flex;flex-direction:column}
  .btn{display:inline-block;padding:.85rem 2rem;border-radius:50px;border:none;cursor:pointer;font-family:'Nunito';font-weight:800;font-size:1rem;transition:all .15s;margin:.25rem;text-decoration:none;color:#fff}
  .btn:hover{transform:scale(1.04)}
  .btn-primary{background:var(--accent)}
  .btn-secondary{background:var(--surface);border:2px solid rgba(255,255,255,.2)}
  .btn-yellow{background:var(--yellow);color:#1a1a2e}
  .btn-green{background:var(--green)}
  .setup-warn{max-width:560px;margin:2rem auto;background:rgba(233,69,96,.12);border:1px solid var(--accent);border-radius:14px;padding:1.25rem 1.5rem;color:#ffd7de;font-size:.9rem;line-height:1.6}
  .setup-warn code{background:rgba(0,0,0,.3);padding:.1rem .4rem;border-radius:4px}
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(90px);background:var(--card);padding:.75rem 1.5rem;border-radius:10px;font-weight:700;font-size:.9rem;transition:transform .3s;z-index:999;border-left:4px solid var(--green)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
  @media(max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
  .tile{display:flex;align-items:center;gap:1rem;padding:1.2rem 1.4rem;border-radius:14px;border:none;color:#fff;font-family:'Nunito';font-weight:800;font-size:1.05rem;text-align:left;cursor:pointer;transition:all .12s;min-height:84px;word-break:break-word}
  .tile:hover:not(:disabled){filter:brightness(1.08);transform:scale(1.01)}
  .tile:disabled{cursor:default}
  .tile.A{background:var(--a)}.tile.B{background:var(--b)}.tile.C{background:var(--c)}.tile.D{background:var(--d);color:#1a1a2e}
  .tile .sh{width:40px;height:40px;flex-shrink:0;border-radius:8px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900}
  .tile.dim{opacity:.35}
  .tile.right{outline:5px solid var(--green);filter:brightness(1.12)}

  #screen-setup{align-items:center;justify-content:center;padding:2rem;text-align:center;background:linear-gradient(135deg,#1a1a2e,#0f3460)}
  .badge{background:var(--accent);color:#fff;font-family:'Nunito';font-weight:900;font-size:.8rem;padding:.35rem 1rem;border-radius:20px;display:inline-block;margin-bottom:1.25rem;letter-spacing:2px;text-transform:uppercase}
  h1.big{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;margin-bottom:.4rem}
  .sub{color:var(--muted);margin-bottom:2rem}
  .pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem;max-width:760px;margin:0 auto 1.5rem}
  .pcard{background:var(--surface);border:2px solid transparent;border-radius:14px;padding:1.1rem;cursor:pointer;text-align:left;transition:all .15s;position:relative;overflow:hidden}
  .pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--pc)}
  .pcard:hover{transform:translateY(-3px);background:var(--card);border-color:rgba(255,255,255,.2)}
  .pcard.sel{border-color:var(--pc);background:var(--card)}
  .pc-n{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--pc);margin-bottom:.4rem}
  .pc-t{font-family:'Nunito';font-weight:800;font-size:1rem;line-height:1.3}
  .pc-m{font-size:.78rem;color:var(--muted);margin-top:.35rem}

  #screen-lobby{padding:1.5rem;background:radial-gradient(ellipse at top,#243b6b,#0e1428 60%)}
  .lobby-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;max-width:1100px;margin:0 auto 1.5rem}
  .join-box{background:var(--surface);border-radius:18px;padding:1.5rem 2rem;display:flex;gap:2rem;align-items:center;flex-wrap:wrap;justify-content:center}
  .qr-host{background:#fff;border-radius:16px;padding:14px;line-height:0}
  .join-info .k{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
  .join-info .url{font-size:1.05rem;font-weight:700;margin:.2rem 0 1rem;word-break:break-all}
  .pin-big{font-family:'Nunito';font-weight:900;font-size:clamp(2.5rem,8vw,4.5rem);letter-spacing:.5rem;color:var(--yellow);line-height:1}
  .pin-lbl{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
  .players-wrap{max-width:1100px;margin:1.5rem auto 0;text-align:center}
  .players-count{font-family:'Nunito';font-weight:900;font-size:1.4rem;margin-bottom:1rem}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
  .chip{background:var(--card);padding:.5rem 1rem;border-radius:20px;font-weight:700;font-size:.9rem;animation:pop .3s}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .lobby-actions{text-align:center;margin-top:2rem}

  #screen-q{padding:1.5rem;background:var(--bg)}
  .q-top{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto 1rem;width:100%}
  .q-idx{font-family:'Nunito';font-weight:800;color:var(--muted)}
  .q-timer-circle{width:80px;height:80px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:900;font-size:2rem;border:5px solid var(--green);transition:border-color .3s}
  .q-timer-circle.urgent{border-color:var(--red)}
  .q-answered{font-family:'Nunito';font-weight:800;color:var(--yellow)}
  .q-text-big{font-family:'Nunito';font-weight:900;font-size:clamp(1.4rem,4vw,2.4rem);line-height:1.35;text-align:center;background:var(--surface);border-radius:18px;padding:2rem;max-width:1000px;margin:0 auto 1.5rem;width:100%}
  .q-tiles{max-width:1000px;margin:0 auto;width:100%}

  #screen-reveal{padding:1.5rem;background:radial-gradient(ellipse at top,#243b6b,#0e1428 65%)}
  .rv-head{text-align:center;max-width:1000px;margin:0 auto 1rem}
  .rv-rate{font-family:'Nunito';font-weight:900;font-size:clamp(2rem,6vw,3.2rem)}
  .rv-sub{color:var(--muted)}
  .rv-grid{display:grid;grid-template-columns:1.2fr .9fr;gap:1.5rem;max-width:1100px;margin:1rem auto;align-items:start}
  @media(max-width:820px){.rv-grid{grid-template-columns:1fr}}
  .bars{background:var(--surface);border-radius:16px;padding:1.25rem}
  .bars-title{font-size:.78rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:1rem}
  .bar-row{display:flex;flex-direction:column;gap:.55rem;padding:.85rem 1rem;border-radius:12px;margin-bottom:.7rem;background:rgba(255,255,255,.04)}
  .bar-row:last-child{margin-bottom:0}
  .bar-row.correct{background:rgba(46,204,113,.13);outline:2px solid var(--green)}
  .bar-head{display:flex;align-items:flex-start;gap:.7rem}
  .bar-sh{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;color:#fff;font-size:.95rem}
  .bar-sh.A{background:var(--a)}.bar-sh.B{background:var(--b)}.bar-sh.C{background:var(--c)}.bar-sh.D{background:var(--d);color:#1a1a2e}
  .bar-label{flex:1;font-weight:700;font-size:1rem;line-height:1.35;word-break:break-word}
  .bar-label .ok{color:var(--green);font-weight:900;margin-left:.25rem}
  .bar-cnt{flex-shrink:0;font-family:'Nunito';font-weight:900;font-size:1.05rem;min-width:2.2rem;text-align:right}
  .bar-track{height:12px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;transition:width .6s;min-width:2px}
  .bar-fill.A{background:var(--a)}.bar-fill.B{background:var(--b)}.bar-fill.C{background:var(--c)}.bar-fill.D{background:var(--d)}
  .scorecard{background:var(--surface);border-radius:16px;padding:1.25rem}
  .scorecard h3{font-size:.78rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:.85rem}
  .lrow{display:flex;align-items:center;gap:.75rem;padding:.6rem .4rem;border-bottom:1px solid rgba(255,255,255,.06)}
  .lrow:last-child{border-bottom:none}
  .rk{font-family:'Nunito';font-weight:900;width:26px;text-align:center;color:var(--muted);flex-shrink:0}
  .rn{flex:1;font-weight:700;line-height:1.3;word-break:break-word}
  .rs{font-family:'Nunito';font-weight:800;color:var(--yellow);flex-shrink:0}
  .rv-actions{text-align:center;margin-top:1.5rem}

  #screen-final{padding:1.5rem;background:radial-gradient(ellipse at top,#243b6b,#0e1428 60%)}
  .f-title{text-align:center;font-size:2rem;font-weight:900;margin:.5rem 0 1.5rem}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:1rem;min-height:360px;max-width:760px;margin:0 auto 1.5rem}
  .plat{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .p-av{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:900;font-size:2rem;color:#1a1a2e;margin-bottom:.5rem;border:4px solid rgba(255,255,255,.3)}
  .p-nm{font-family:'Nunito';font-weight:800;font-size:1.15rem;text-align:center;max-width:210px;line-height:1.25;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .p-sc{color:var(--yellow);font-weight:800;margin-bottom:.55rem}
  .p-bl{width:100%;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:1rem;font-family:'Nunito';font-weight:900;font-size:2.8rem;color:rgba(255,255,255,.9)}
  .first .p-av{background:var(--gold)}.first .p-bl{background:linear-gradient(180deg,var(--gold),#b8860b);height:280px}
  .second .p-av{background:var(--silver)}.second .p-bl{background:linear-gradient(180deg,var(--silver),#808080);height:200px}
  .third .p-av{background:var(--bronze)}.third .p-bl{background:linear-gradient(180deg,var(--bronze),#8b5a2b);height:140px}
  .crown{font-size:2rem;margin-bottom:.25rem}
  .f-board{max-width:600px;margin:0 auto}
</style>
</head>
<body>

<div id="screen-setup" class="screen active">
  <div class="badge">SAFe® POPM · Live Game</div>
  <h1 class="big">🎬 Host a Live Game</h1>
  <p class="sub">Pick a lesson. Everyone gets the same questions, in sync.</p>
  <div id="fb-warn"></div>
  <div class="pick" id="pick"></div>
  <button class="btn btn-primary" id="create-btn" style="font-size:1.1rem;padding:1rem 3rem" onclick="createGame()" disabled>Create game →</button>
  <div style="margin-top:1rem"><a class="btn btn-secondary" href="index.html" style="font-size:.85rem;padding:.5rem 1.2rem">← Hub</a></div>
</div>

<div id="screen-lobby" class="screen">
  <div class="lobby-top">
    <div><h1 class="big" id="lobby-lesson">Lesson</h1><span class="sub" id="lobby-sub"></span></div>
    <button class="btn btn-secondary" onclick="cancelGame()" style="font-size:.85rem;padding:.5rem 1.2rem">✕ End game</button>
  </div>
  <div class="join-box">
    <div class="qr-host" id="qr-host"></div>
    <div class="join-info">
      <div class="k">Join at</div>
      <div class="url" id="join-url">play.html</div>
      <div class="pin-lbl">Game PIN</div>
      <div class="pin-big" id="pin-big">------</div>
    </div>
  </div>
  <div class="players-wrap">
    <div class="players-count" id="players-count">Waiting for players…</div>
    <div class="chips" id="chips"></div>
    <div class="lobby-actions">
      <button class="btn btn-green" id="start-btn" style="font-size:1.15rem;padding:1rem 3.5rem" onclick="startGame()">Start game 🚀</button>
    </div>
  </div>
</div>

<div id="screen-q" class="screen">
  <div class="q-top">
    <div class="q-idx" id="q-idx">Question 1 / 10</div>
    <div class="q-timer-circle" id="q-timer">20</div>
    <div class="q-answered" id="q-answered">0 answered</div>
  </div>
  <div class="q-text-big" id="q-text"></div>
  <div class="q-tiles tiles" id="q-tiles"></div>
</div>

<div id="screen-reveal" class="screen">
  <div class="rv-head">
    <div class="rv-rate" id="rv-rate">–</div>
    <div class="rv-sub" id="rv-sub">answered correctly</div>
  </div>
  <div class="rv-grid">
    <div class="bars" id="rv-bars"></div>
    <div class="scorecard"><h3>🏆 Leaderboard</h3><div id="rv-board"></div></div>
  </div>
  <div class="rv-actions">
    <button class="btn btn-yellow" id="next-btn" style="font-size:1.1rem;padding:.9rem 3rem" onclick="nextQuestion()">Next →</button>
  </div>
</div>

<div id="screen-final" class="screen">
  <div class="f-title">🏆 Final Results</div>
  <div class="podium" id="f-podium"></div>
  <div class="f-board" id="f-board"></div>
  <div style="text-align:center;margin-top:1.5rem">
    <button class="btn btn-primary" onclick="location.reload()">🔄 New game</button>
    <a class="btn btn-secondary" href="index.html">🏠 Hub</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════ FIREBASE CONFIG (required for live multiplayer) ═══════════
   One-time setup (free, ~5 min):
   1. Go to https://console.firebase.google.com  →  Add project
   2. Build → Realtime Database → Create database → Start in TEST MODE
   3. Project settings (gear) → Your apps → Web app (</>) → register
   4. Copy the firebaseConfig object it gives you over the one below
      (make sure databaseURL is included).
   The SAME config goes in BOTH host-game.html and play.html. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBUjsot15FuYuB2or9XklqF3H_-Bnxi9YE",
  authDomain: "safe-quiz-20238.firebaseapp.com",
  databaseURL: "https://safe-quiz-20238-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "safe-quiz-20238",
  storageBucket: "safe-quiz-20238.firebasestorage.app",
  messagingSenderId: "728130638190",
  appId: "1:728130638190:web:6f9ae15944ad6c2b6d317f",
  measurementId: "G-F63L91MNJV"
};

const LESSONS = [{"id": 1, "title": "Exploring Product Roles and Responsibilities", "icon": "🧭", "color": "#e21b3c", "draw": 10, "questions": [{"q": "Which best describes the two types of value streams in SAFe?", "answers": ["Portfolio and Program value streams", "Operational and Development value streams", "Internal and External value streams", "Strategic and Tactical value streams"], "correct": 1, "explanation": "SAFe defines Operational Value Streams (deliver a product/service to a customer) and Development Value Streams (convert a business hypothesis into a solution).", "qid": "L1Q0"}, {"q": "What is an Operational Value Stream?", "answers": ["The sequence of activities needed to convert a hypothesis into a solution", "The sequence of activities used to deliver a product or service to a customer", "A backlog of features for one ART", "A multiyear product roadmap"], "correct": 1, "explanation": "An operational value stream is the sequence of activities to deliver a product/service to a customer (e.g., fulfilling an order, treating a patient).", "qid": "L1Q1"}, {"q": "Who owns, defines, and prioritizes the ART backlog?", "answers": ["The Product Owner", "Product Management", "The Release Train Engineer", "The System Architect"], "correct": 1, "explanation": "Product Management has content authority for the ART backlog, vision, and roadmap and establishes Features and acceptance criteria.", "qid": "L1Q2"}, {"q": "Who has content authority for the team backlog?", "answers": ["Product Management", "The Scrum Master/Team Coach", "The Product Owner", "Business Owners"], "correct": 2, "explanation": "The Product Owner has team backlog content authority, guides iteration goals via prioritized stories, and accepts stories.", "qid": "L1Q3"}, {"q": "Which is a core responsibility area of Product Management?", "answers": ["Facilitating PI Planning logistics", "Exploring markets and users", "Removing team impediments daily", "Running the Team Sync"], "correct": 1, "explanation": "Product Management areas of responsibility include connecting with the customer, exploring markets and users, the vision/roadmap, managing the ART backlog, and delivering value.", "qid": "L1Q4"}, {"q": "What is an Agile Release Train (ART)?", "answers": ["A single team of 10 or fewer people", "A virtual organization of 5–12 teams synchronized on a common cadence", "A portfolio of value streams", "A backlog of epics"], "correct": 1, "explanation": "An ART is a virtual organization of 5–12 teams (50–125+ people) aligned to a common mission via a single ART backlog and synchronized on a PI.", "qid": "L1Q5"}, {"q": "According to SAFe, how does AI change Agile product development?", "answers": ["It replaces the need for a Product Owner", "It changes the speed, not the foundations", "It removes the need for customer feedback", "It eliminates the Lean-Agile mindset"], "correct": 1, "explanation": "AI increases decision velocity, experimentation, and feedback — it changes the speed, not the foundations. SAFe foundations still guide its responsible use.", "qid": "L1Q6"}, {"q": "What does RAG (Retrieval Augmented Generation) primarily improve?", "answers": ["The speed of model training", "Grounding responses in provided information to reduce hallucination", "The size of the language model", "The number of prompts allowed"], "correct": 1, "explanation": "RAG keeps responses grounded in information the user provides, reducing hallucination risk and improving trust, accuracy, and compliance.", "qid": "L1Q7"}, {"q": "In the SAFe prompting structure, what does the 'CONTEXT' element provide?", "answers": ["The end objective of the prompt", "Background knowledge not in the AI's training data", "The persona the AI should adopt", "Formatting and style limits"], "correct": 1, "explanation": "GOAL, ROLE, TASK, CONTEXT, DETAILS — CONTEXT gives the AI specific background knowledge it wouldn't otherwise have.", "qid": "L1Q8"}, {"q": "What is an AI agent, per the course?", "answers": ["A person who manages AI tools", "A GenAI system that can decide what to do next and take actions on its own", "A structured dataset", "A type of prompt template"], "correct": 1, "explanation": "An AI agent is a GenAI system that, given a goal, plans, uses tools, and adjusts actions to meet the objective — increasing both impact and risk.", "qid": "L1Q9"}, {"q": "How do the PO, Product Management, and Agile Team partnership relate?", "answers": ["Product Management works the team backlog while the PO owns the ART backlog", "Product Management guides vision/ART backlog; the PO manages the team backlog; the team implements", "The team owns the vision and roadmap", "The PO facilitates Continuous Exploration for the ART"], "correct": 1, "explanation": "Product Management guides the vision and ART backlog, the PO manages/prioritizes the team backlog, and the Agile Team implements — all seeking feedback frequently.", "qid": "L1Q10"}, {"q": "Which is one of the five principles of Lean thinking embraced in the Lean-Agile mindset?", "answers": ["Maximize utilization of all workers", "Let the customer pull value from the producer", "Plan the entire solution up front", "Centralize all decisions"], "correct": 1, "explanation": "Lean thinking: specify value, identify the value stream, make value flow, let the customer pull value, and pursue perfection.", "qid": "L1Q11"}, {"q": "What is an Agile Team in SAFe?", "answers": ["A group of 20–30 specialists", "A cross-functional, self-organizing team of 10 or fewer that defines, builds, tests, and delivers value", "A management review board", "A temporary project team disbanded after each PI"], "correct": 1, "explanation": "An Agile Team is a cross-functional, self-organizing team of 10 or fewer, using SAFe Scrum or Team Kanban, delivering value every iteration.", "qid": "L1Q12"}, {"q": "How do humans and machines differ in intelligence, per the course?", "answers": ["Machines are emotionally aware; humans find patterns", "Humans handle context, nuance, and moral reasoning; machines find patterns at scale but lack judgment", "They are identical in capability", "Machines possess consciousness and intent"], "correct": 1, "explanation": "Humans are flexible, emotionally aware, and capable of moral reasoning; machines excel at patterns at scale but lack consciousness, intent, or ethical judgment.", "qid": "L1Q13"}, {"q": "Which role provides architectural guidance and technical enablement to the teams on the train?", "answers": ["Business Owners", "System Architect", "Release Train Engineer", "Product Owner"], "correct": 1, "explanation": "The System Architect provides architectural guidance and technical enablement; the RTE coaches the ART; Business Owners are key stakeholders.", "qid": "L1Q14"}, {"q": "What best describes a Large Language Model (LLM)?", "answers": ["A system that only stores structured data", "A GenAI system trained on vast text that understands questions and generates human-like responses", "A tool that guarantees factual accuracy", "A database of company policies"], "correct": 1, "explanation": "LLMs (e.g., ChatGPT) are GenAI systems trained on vast text; prompting is how users communicate with them. Best for explaining, summarizing, brainstorming.", "qid": "L1Q15"}]}, {"id": 2, "title": "Preparing for PI Planning", "icon": "📅", "color": "#1368ce", "draw": 10, "questions": [{"q": "What is a Planning Interval (PI)?", "answers": ["A single two-week iteration", "A timebox (typically 8–12 weeks) during which an ART delivers incremental value", "A one-year roadmap horizon", "A backlog refinement session"], "correct": 1, "explanation": "A PI is a timebox—typically 8–12 weeks of development iterations plus an IP iteration—during which an ART delivers working, tested value.", "qid": "L2Q0"}, {"q": "Who owns feature priorities during PI Planning?", "answers": ["Agile Teams", "Product Management", "The Scrum Master/Team Coach", "The System Team"], "correct": 1, "explanation": "Product Management owns feature priorities; Agile Teams own story planning and high-level estimates.", "qid": "L2Q1"}, {"q": "What is a Feature in SAFe?", "answers": ["A container for a portfolio-level initiative", "A service that fulfills a stakeholder need, with a benefit hypothesis and acceptance criteria, delivered by an ART in a PI", "A small piece of functionality done in one iteration", "A backlog constraint like performance"], "correct": 1, "explanation": "A feature is a service that fulfills a stakeholder need — with a name, benefit hypothesis, and acceptance criteria — sized to be delivered by an ART in a PI.", "qid": "L2Q2"}, {"q": "What is a solution vision?", "answers": ["A detailed list of every story for the PI", "A description of the future state of the product or solution", "A prioritized team backlog", "A risk register"], "correct": 1, "explanation": "A solution vision describes the future state of the product/solution — the problem it solves, features/benefits, for whom, and NFRs.", "qid": "L2Q3"}, {"q": "How do market rhythms differ from market events?", "answers": ["Rhythms are unpredictable; events are cyclical", "Rhythms are cyclical and predictable; events are ad-hoc and often unpredictable", "They are the same thing", "Rhythms only apply to internal stakeholders"], "correct": 1, "explanation": "Market rhythms are cyclical and predictable (e.g., seasonal), while market events are ad-hoc and often unpredictable — both influence release timing and roadmaps.", "qid": "L2Q4"}, {"q": "What is WSJF used for?", "answers": ["Estimating story points", "Prioritizing jobs to maximize economic outcome (cost of delay divided by job size)", "Measuring team velocity", "Calculating team capacity"], "correct": 1, "explanation": "Weighted Shortest Job First = Cost of Delay ÷ Job Size. It sequences work to improve economic outcomes; if you quantify one thing, quantify cost of delay.", "qid": "L2Q5"}, {"q": "What are the three components of Cost of Delay in WSJF?", "answers": ["Volume, complexity, uncertainty", "User-business value, time criticality, and risk reduction/opportunity enablement", "Regulatory, commercial, and market value", "Duration, effort, and dependencies"], "correct": 1, "explanation": "Cost of Delay = user-business value + time criticality + risk reduction/opportunity enablement; WSJF divides this by job size.", "qid": "L2Q6"}, {"q": "What is the purpose of capacity allocation on the ART?", "answers": ["To assign developers to specific tasks", "To balance new feature development with enablers, tech debt, and maintenance", "To set the PI length", "To calculate business value scores"], "correct": 1, "explanation": "Capacity allocation devotes a percentage of the train's capacity to enablers/tech debt/maintenance vs. new features, keeping the architectural runway healthy.", "qid": "L2Q7"}, {"q": "What do enablers build?", "answers": ["The team's PI objectives", "The architectural runway (exploration, architecture, infrastructure, compliance)", "The confidence vote", "The operational value stream"], "correct": 1, "explanation": "Enablers build up the architectural runway — exploration, architecture, infrastructure, and compliance — which features then consume.", "qid": "L2Q8"}, {"q": "What does the ART Kanban do?", "answers": ["Replaces PI Planning", "Visualizes and manages the flow of features from funnel to done, with WIP limits", "Tracks individual developer hours", "Stores the portfolio backlog"], "correct": 1, "explanation": "The ART Kanban visualizes flow of work items across process steps with explicit policies and WIP limits to promote flow and continuous delivery of value.", "qid": "L2Q9"}, {"q": "Regarding preparation for PI Planning, which statement is true?", "answers": ["More preparation is always better", "Both too much and too little preparation can cause problems", "Preparation should be skipped for new features", "Only the RTE prepares for PI Planning"], "correct": 1, "explanation": "Too little preparation causes problems, but too much can inhibit exploration and emergent design. Ongoing socialization and refinement drive the right level.", "qid": "L2Q10"}, {"q": "How many top features are typically socialized to set expectations for PI Planning?", "answers": ["The top 3", "The top 10 (as a guideline)", "All features in the portfolio", "Exactly 12"], "correct": 1, "explanation": "Product Management socializes the top 10 features to set expectations; the top 10 is a guideline — the ART may pull more or fewer.", "qid": "L2Q11"}, {"q": "What is the 'Garbage In, Garbage Out' principle for AI?", "answers": ["Old data should be deleted regularly", "Flawed, incomplete, or biased data produces flawed or biased AI output", "Prompt length determines accuracy", "AI improves data quality automatically"], "correct": 1, "explanation": "AI value depends on data — bad data yields biased or misleading output that may even look good. Good data = smart, fair, valuable AI.", "qid": "L2Q12"}, {"q": "What is the primary purpose of design thinking tools like personas and journey maps?", "answers": ["To replace the ART backlog", "To understand customers and design the end-to-end experience", "To calculate WSJF", "To assign business value"], "correct": 1, "explanation": "Personas characterize users and journey maps design the end-to-end experience — design-thinking tools for creating customer-centric features.", "qid": "L2Q13"}, {"q": "In the Whole Product Model, what is the Minimum Viable Product (MVP)?", "answers": ["The fully augmented product with all differentiators", "An early and minimal version of a new product", "The potential product envisioned for the future", "The core product with all expected attributes"], "correct": 1, "explanation": "The MVP offers an early, minimal version; whole-product thinking then layers core, expected, augmented, and potential product attributes.", "qid": "L2Q14"}, {"q": "Who are the typical WSJF prioritization stakeholders?", "answers": ["Only the Product Owner", "Business Owners, Product Management, POs, and System Architects", "Only the RTE", "The whole ART including all developers"], "correct": 1, "explanation": "WSJF is estimated collaboratively by Business Owners, Product Management, Product Owners, and System Architects.", "qid": "L2Q15"}]}, {"id": 3, "title": "Leading PI Planning", "icon": "🗣️", "color": "#26890c", "draw": 10, "questions": [{"q": "What are PI objectives?", "answers": ["A list of every story to be delivered", "Business summaries of the business and technical goals teams intend to deliver in the PI", "The ART's confidence vote results", "The capacity allocation policy"], "correct": 1, "explanation": "PI objectives are business summaries of the goals a team intends to deliver in the PI; they often relate to intended features but are written in business terms.", "qid": "L3Q0"}, {"q": "Why commit to PI objectives instead of a specific list of features?", "answers": ["It removes the need for a confidence vote", "It enhances agility — teams can modify planned work based on discovery and still achieve the business value", "It guarantees all features are delivered", "It lets business leaders make the commitment"], "correct": 1, "explanation": "Committing to objectives (predictability without specificity) lets teams adjust the planned work based on discovery/customer input and still deliver the value.", "qid": "L3Q1"}, {"q": "What are uncommitted objectives?", "answers": ["Extra work teams do 'just in case they have time'", "Planned objectives not included in the commitment, used to improve predictability", "Objectives only Business Owners can see", "Objectives with a business value of zero"], "correct": 1, "explanation": "Uncommitted objectives are planned (and count toward load) but excluded from the commitment to make the commitment more reliable and improve predictability.", "qid": "L3Q2"}, {"q": "What does 'ROAM' stand for when addressing ART PI risks?", "answers": ["Review, Own, Assess, Manage", "Resolved, Owned, Accepted, Mitigated", "Reduce, Observe, Act, Monitor", "Risk, Opportunity, Action, Milestone"], "correct": 1, "explanation": "Risks are ROAMed: Resolved, Owned, Accepted, or Mitigated.", "qid": "L3Q3"}, {"q": "What are the two parts of the PI Planning confidence vote commitment?", "answers": ["Deliver all features and never change scope", "Do everything in their power to meet objectives, and escalate immediately if an objective becomes unachievable", "Vote by fist-of-five and accept the majority", "Commit only to uncommitted objectives"], "correct": 1, "explanation": "Teams agree to do everything in their power to meet objectives AND to escalate immediately if facts show an objective isn't achievable.", "qid": "L3Q4"}, {"q": "Who assigns business value to team PI objectives?", "answers": ["The Scrum Master alone", "Business Owners, in collaboration with teams", "The RTE", "Product Management alone"], "correct": 1, "explanation": "Teams establish business value for their PI objectives together with Business Owners during PI Planning.", "qid": "L3Q5"}, {"q": "What makes team PI objectives 'SMART'?", "answers": ["Simple, Modern, Agile, Ready, Tested", "Specific, Measurable, Achievable, Realistic, Time-bound", "Strategic, Managed, Aligned, Reviewed, Tracked", "Small, Meaningful, Accepted, Refined, Timed"], "correct": 1, "explanation": "Effective PI objectives are SMART: Specific, Measurable, Achievable, Realistic, and Time-bound — written without jargon so Business Owners understand them.", "qid": "L3Q6"}, {"q": "What is the purpose of the ART planning board?", "answers": ["To track individual developer tasks", "To visualize features, milestones, and dependencies across teams", "To store the portfolio backlog", "To record the confidence vote"], "correct": 1, "explanation": "The ART planning board visualizes work — features, milestones, and dependencies between teams — helping identify and manage dependencies during PI Planning.", "qid": "L3Q7"}, {"q": "Which is a strategy for managing a bottleneck dependency?", "answers": ["Ignore it until the next PI", "Distribute work to other teams", "Add more uncommitted objectives", "Remove the confidence vote"], "correct": 1, "explanation": "Dependency strategies include distributing work to other teams (bottlenecks), adjusting sequencing (iteration dependencies), and splitting features/stories.", "qid": "L3Q8"}, {"q": "During PI Planning day one, what do POs and Product Management primarily do?", "answers": ["Accept team PI objectives and run the confidence vote", "Communicate the vision and top 10 features, and support team breakouts", "Rate PI performance", "Run the Inspect & Adapt workshop"], "correct": 1, "explanation": "On day one they communicate the vision and top 10 features, support breakouts, help decompose features into stories, and join the management review.", "qid": "L3Q9"}, {"q": "When building the final plan, what role do Business Owners play?", "answers": ["They write all the team PI objectives", "They are asked whether they accept the plans", "They assign story points", "They facilitate the retrospective"], "correct": 1, "explanation": "All teams review final plans and Business Owners are asked whether they accept them; if not, teams continue planning after the review.", "qid": "L3Q10"}, {"q": "Which is a category to consider when assigning business value?", "answers": ["Velocity value", "Regulatory value", "Story-point value", "Refactoring value"], "correct": 1, "explanation": "Business value considerations include regulatory, commercial, market, efficiency, and future value.", "qid": "L3Q11"}, {"q": "When communicating the vision, why provide user personas?", "answers": ["To assign business value scores", "To illustrate how the vision improves the experiences of customers", "To calculate WSJF", "To replace acceptance criteria"], "correct": 1, "explanation": "Personas help teams see how the vision improves real customer experiences, alongside NFRs and how top roadmap features fulfill the vision.", "qid": "L3Q12"}, {"q": "Who commits to the PI objectives?", "answers": ["Business leaders", "The teams, not business leaders", "Product Management only", "The RTE"], "correct": 1, "explanation": "Teams — not business leaders — commit to the PI objectives, which reinforces decentralized decision-making and ownership.", "qid": "L3Q13"}, {"q": "When should a PI objective be moved to 'uncommitted'?", "answers": ["When it has the highest business value", "When a team has low confidence or the objective has many unknowns", "When Business Owners request it", "Only after the PI ends"], "correct": 1, "explanation": "If confidence is low or there are many unknowns, move the objective to uncommitted and consider early spikes — this preserves predictability.", "qid": "L3Q14"}]}, {"id": 4, "title": "Executing Iterations", "icon": "⚙️", "color": "#ffa602", "draw": 10, "questions": [{"q": "What is a user story's standard 'user voice' format?", "answers": ["Given [context], When [action], Then [result]", "As a [user role], I want [activity] so that [business value]", "Feature, Benefit, Acceptance", "Epic, Capability, Feature"], "correct": 1, "explanation": "The user-voice format fosters customer-centric design: As a (user role), I want (activity) so that (business value).", "qid": "L4Q0"}, {"q": "What do the letters in INVEST stand for?", "answers": ["Independent, Negotiable, Valuable, Estimable, Small, Testable", "Integrated, New, Verified, Estimated, Sized, Tracked", "Innovative, Necessary, Viable, Efficient, Simple, Tested", "Independent, Named, Validated, Efficient, Scoped, Timed"], "correct": 0, "explanation": "Good stories are INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable.", "qid": "L4Q1"}, {"q": "What are the 'Three Cs' of a good story?", "answers": ["Cost, Complexity, Capacity", "Card, Conversation, Confirmation", "Context, Content, Commitment", "Create, Check, Complete"], "correct": 1, "explanation": "Card (written briefly), Conversation (details with the PO), Confirmation (acceptance criteria confirm correctness).", "qid": "L4Q2"}, {"q": "Who leads Iteration Planning?", "answers": ["The Release Train Engineer", "The Product Owner", "The System Architect", "Business Owners"], "correct": 1, "explanation": "Product Owners lead Iteration Planning, which refines the iteration plans created during PI Planning.", "qid": "L4Q3"}, {"q": "What do story points represent?", "answers": ["Exact hours of effort", "Volume, complexity, knowledge, and uncertainty — a relative measure", "The business value of a story", "The number of acceptance criteria"], "correct": 0, "explanation": "A story point is a relative number reflecting volume, complexity, knowledge, and uncertainty — not tied to any specific unit of measure.", "qid": "L4Q4"}, {"q": "When is a story considered complete?", "answers": ["When it is coded", "When it satisfies the Definition of Done — meets acceptance criteria and is accepted by the PO", "When it is demoed", "When it is estimated"], "correct": 1, "explanation": "A story is done when it satisfies the Definition of Done: it meets the acceptance criteria and is accepted by the Product Owner.", "qid": "L4Q5"}, {"q": "What syntax is used to write testable acceptance criteria (BDD)?", "answers": ["As a / I want / So that", "Given / When / Then", "If / Else / Then", "Card / Conversation / Confirmation"], "correct": 1, "explanation": "Behavior-driven development uses 'Given-When-Then' syntax so acceptance criteria are testable.", "qid": "L4Q6"}, {"q": "What are the three purposes of iteration goals?", "answers": ["Estimate, commit, deliver", "Provide transparency/management info, align members to a common purpose, and align teams to PI objectives", "Plan, build, release", "Prioritize, sequence, accept"], "correct": 1, "explanation": "Iteration goals provide clarity, commitment, and management information — aligning team members and aligning teams to common PI objectives.", "qid": "L4Q7"}, {"q": "How does a team meet its iteration commitment?", "answers": ["By always delivering every planned story no matter what", "By doing everything they said, OR immediately raising the concern if it isn't feasible", "By working overtime", "By reducing the Definition of Done"], "correct": 1, "explanation": "A team meets its commitment by doing everything it said it would — or by immediately raising the concern if that isn't feasible.", "qid": "L4Q8"}, {"q": "What is Backlog Refinement?", "answers": ["A ceremony to delete old stories", "A preview and elaboration of upcoming stories to prepare for Iteration Planning", "The final acceptance of stories", "A risk-management workshop"], "correct": 1, "explanation": "Backlog Refinement previews and elaborates upcoming stories — improving them, adding acceptance criteria, and resolving dependencies before Iteration Planning.", "qid": "L4Q9"}, {"q": "What does the Iteration Review demonstrate?", "answers": ["The plan for the next iteration", "A working, tested team increment to stakeholders — the true measure of progress", "Individual performance ratings", "Velocity compared to other teams"], "correct": 1, "explanation": "The Iteration Review shows a working, tested increment (every story, spike, refactor, and NFR) — the true measure of progress.", "qid": "L4Q10"}, {"q": "How should a PO behave during the Team Sync?", "answers": ["Direct the team's daily tasks", "Attend as a team member, listen for impediments, and clarify story intent and acceptance criteria", "Skip it — it's only for developers", "Assign story points"], "correct": 1, "explanation": "POs attend the Team Sync as team members, listen for impediments to resolve in the meet-after, and stand ready to clarify story intent/acceptance criteria.", "qid": "L4Q11"}, {"q": "What is estimating poker designed to do?", "answers": ["Let a manager set the estimates", "Combine expert opinion, analogy, and disaggregation for fast, reliable relative estimates with all members participating", "Convert points to hours", "Replace the Definition of Done"], "correct": 1, "explanation": "Estimating poker combines expert opinion, analogy, and disaggregation; all members participate (the PO supports but doesn't estimate) to build shared agreement.", "qid": "L4Q12"}, {"q": "What is a story map?", "answers": ["A risk register for the ART", "A design-thinking tool that captures user workflow and the stories that support it", "A capacity allocation policy", "A confidence-vote record"], "correct": 1, "explanation": "A story map captures a user workflow and the supporting stories, helping teams design workflows and validate that the backlog supports the user's objective.", "qid": "L4Q13"}, {"q": "What does the Continuous Delivery Pipeline (CDP) represent?", "answers": ["The portfolio budgeting process", "The workflows, activities, and automation needed to deliver new functionality more frequently", "The team's Definition of Done", "The ART Kanban's WIP limits"], "correct": 1, "explanation": "The CDP is the workflows, activities, and automation to deliver value frequently: Continuous Exploration, Integration, Deployment, and Release on Demand.", "qid": "L4Q14"}, {"q": "What is the timebox for the Iteration Retrospective?", "answers": ["10–15 minutes", "30–60 minutes", "2–4 hours", "One full day"], "correct": 1, "explanation": "The Iteration Retrospective is 30–60 minutes: pick one or two improvement items and enter them into the team backlog.", "qid": "L4Q15"}]}, {"id": 5, "title": "Executing the PI", "icon": "🏁", "color": "#9b59b6", "draw": 10, "questions": [{"q": "What is the purpose of the PO Sync?", "answers": ["To plan the next iteration's stories", "To provide visibility into ART progress toward PI objectives and assess scope adjustments", "To run the confidence vote", "To demo the system increment"], "correct": 1, "explanation": "The PO Sync gives visibility into ART progress toward PI objectives, assesses scope adjustments, and helps prepare for the next PI.", "qid": "L5Q0"}, {"q": "Who facilitates the PO Sync, and how often does it occur?", "answers": ["The PO; monthly", "The RTE or Product Management; weekly or more, 30–60 minutes", "The System Architect; daily", "Business Owners; once per PI"], "correct": 1, "explanation": "The PO Sync is facilitated by the RTE or Product Management, includes PMs/POs/stakeholders, and runs weekly or more often for 30–60 minutes.", "qid": "L5Q1"}, {"q": "How often is the full system increment demonstrated in the System Demo?", "answers": ["Once per PI", "Every two weeks (may lag by up to one iteration)", "Daily", "Only at Inspect & Adapt"], "correct": 1, "explanation": "The System Demo shows the full system increment every two weeks, from a staging environment; it may lag the iteration by at most one iteration.", "qid": "L5Q2"}, {"q": "What is the Innovation and Planning (IP) iteration for?", "answers": ["Catching up on unfinished stories only", "Innovation, cadence-based planning, and an estimating guard band for reliable delivery", "Running the System Demo", "Portfolio budgeting"], "correct": 1, "explanation": "The IP iteration enables innovation (hackathons, infrastructure), cadence-based planning, and provides an estimating guard band — PI Planning also occurs here.", "qid": "L5Q3"}, {"q": "What are the three parts of the Inspect & Adapt (I&A) event?", "answers": ["Plan, Do, Check", "PI System Demo, quantitative/qualitative measurement, and the problem-solving workshop", "Vision, objectives, risks", "Explore, Integrate, Deploy"], "correct": 1, "explanation": "I&A has three parts: the PI System Demo, quantitative and qualitative measurement, and the problem-solving workshop (timebox 3–4 hours).", "qid": "L5Q4"}, {"q": "How is a team's PI percent achievement calculated?", "answers": ["Story points delivered divided by story points planned", "Actual business value total divided by planned business value total (uncommitted objectives can push it over 100%)", "Number of stories accepted", "Average velocity across iterations"], "correct": 1, "explanation": "Percent achievement = actual total ÷ planned total. Planned total excludes uncommitted objectives, so completing them can exceed 100%.", "qid": "L5Q5"}, {"q": "What are the six steps of the problem-solving workshop?", "answers": ["Plan → Do → Check → Act → Reflect → Improve", "Agree on the problem → Pareto analysis → 5 Whys/root cause → Restate problem → Brainstorm solutions → Identify improvement items", "Measure → Analyze → Assign → Fix → Verify → Close", "Explore → Integrate → Deploy → Release → Review → Adapt"], "correct": 1, "explanation": "Agree on the problem → find the biggest root cause with Pareto → apply 5 Whys → restate the problem → brainstorm solutions → identify improvement backlog items.", "qid": "L5Q6"}, {"q": "What are the three aspects of Responsible AI?", "answers": ["Fast AI, Cheap AI, Smart AI", "Trustworthy AI, Explainable AI, Human-centric AI", "Narrow AI, General AI, Super AI", "Cloud AI, Edge AI, Hybrid AI"], "correct": 1, "explanation": "Responsible AI is framed as Trustworthy AI, Explainable AI, and Human-centric AI.", "qid": "L5Q7"}, {"q": "Which attributes belong to 'Trustworthy AI'?", "answers": ["Transparency and Interpretability", "Privacy, Security, Resilience, Reliability, and Accuracy", "Fairness, Ethics, and Inclusiveness", "Safety and Sustainability"], "correct": 1, "explanation": "Trustworthy AI: Privacy, Security, Resilience, Reliability, Accuracy. (Transparency/Interpretability = Explainable; Fairness/Ethics = Human-centric.)", "qid": "L5Q8"}, {"q": "Which is a common AI risk highlighted in the course?", "answers": ["Faster onboarding", "Hallucination — outputs that seem wrong or nonsensical due to data/model flaws", "Reduced decision velocity", "Improved data quality"], "correct": 1, "explanation": "Common AI risks include bias, hallucination (plausible but wrong outputs), and data leaks of sensitive information.", "qid": "L5Q9"}, {"q": "What is a hackathon in the IP iteration?", "answers": ["A mandatory next-PI planning event", "A 1–2 day event where teams work on mission-aligned ideas and demo results at the end", "A supplier contract review", "A portfolio budgeting session"], "correct": 1, "explanation": "A hackathon is a 1–2 day event: people work on what they want, with whom they want, as long as it reflects the mission — then demo their work.", "qid": "L5Q10"}, {"q": "What is a spike?", "answers": ["A sudden rise in velocity", "An exploration enabler story to gain knowledge and reduce risk of a technical approach or requirement", "A committed PI objective", "A type of confidence vote"], "correct": 1, "explanation": "A spike is an exploration enabler story used to reduce the risk of a technical approach, understand a requirement, or improve estimate reliability.", "qid": "L5Q11"}, {"q": "What is a key principle of responsible AI use with data?", "answers": ["All company data is safe to paste into public tools", "Assume it's public — never input confidential data into public AI tools; use approved private instances", "AI output never needs fact-checking", "Only the RTE may use AI tools"], "correct": 1, "explanation": "Assume it's public: never input confidential/PII into public AI tools, be the skeptic (treat output as a first draft), and know your company's rules.", "qid": "L5Q12"}, {"q": "Which are the four shifts required to enable AI-Empowered Agility?", "answers": ["Plan, build, test, release", "Focus on outcomes & intent; iterative learning & rapid experimentation; development & innovation at scale; cross-functional AI-augmented teams", "Explore, integrate, deploy, release", "Trustworthy, explainable, human-centric, ethical"], "correct": 1, "explanation": "The four shifts: focus on outcomes and intent; iterative learning/rapid experimentation; development and innovation at scale; and cross-functional, AI-augmented teams.", "qid": "L5Q13"}, {"q": "What is the PI System Demo (at Inspect & Adapt)?", "answers": ["A per-team demo led by developers", "An end-of-PI demo of the current solution state to stakeholders, often led by PM/POs/system team (45–60 min)", "The bi-weekly System Demo", "The Iteration Review"], "correct": 1, "explanation": "At I&A, the PI System Demo shows the current solution state to stakeholders (Business Owners, PM, RTE, SM/TCs, teams), timeboxed to 45–60 minutes.", "qid": "L5Q14"}]}, {"id": 6, "title": "Get Certified", "icon": "🎓", "color": "#1abc9c", "draw": 10, "questions": [{"q": "Where do you access your path to SAFe certification?", "answers": ["Only through your instructor by email", "Your Learning Plan in SAFe Studio", "A third-party exam site", "The public SAFe website homepage"], "correct": 1, "explanation": "The Learning Plan in SAFe Studio is your path to certification — download the workbook, give feedback, and access preparation materials.", "qid": "L6Q0"}, {"q": "What does attending this course give learners access to?", "answers": ["A free SAFe consulting engagement", "The SAFe Product Owner/Product Manager exam and related preparation materials", "Lifetime SPC certification", "A guaranteed pass on the exam"], "correct": 1, "explanation": "Attending the course gives learners access to the SAFe POPM exam and related preparation materials.", "qid": "L6Q1"}, {"q": "Why is completing the course feedback survey important?", "answers": ["It is required to pass the exam", "Results are used to improve courses and help instructors improve (and remain anonymous to the instructor)", "It unlocks the workbook", "It sets your exam date"], "correct": 1, "explanation": "Survey results improve courses and help instructors; feedback remains anonymous to the instructor.", "qid": "L6Q2"}, {"q": "What is SAFe Connect described as?", "answers": ["An exam proctoring service", "Your professional 'neighborhood' — a global network of certified peers with role-based events and content", "A billing portal", "A code re const DUR = 20;
let db=null, fbReady=false;
function configLooksSet(){const c=FIREBASE_CONFIG||{};return !!(c.apiKey&&c.databaseURL&&c.apiKey.indexOf('PASTE')<0&&c.databaseURL.indexOf('PASTE')<0);}
function ensureFirebase(){
  if(fbReady)return '';
  if(typeof firebase==='undefined')return "Firebase didn't load — check your internet connection (the app loads Firebase from the web), then reload the page.";
  if(!configLooksSet())return "Firebase isn't set up yet.\n\nOpen host-game.html and play.html, paste your firebaseConfig into the block at the top of the script, save, then reload this page.";
  try{ if(!firebase.apps||!firebase.apps.length){firebase.initializeApp(FIREBASE_CONFIG);} db=firebase.database(); fbReady=true; return ''; }
  catch(e){ return "Firebase init error: "+((e&&e.message)||e); }
}

let selLesson=null, pin=null, gameRef=null, game=null, hostTimer=null, revealed=false;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* setup screen */
function initSetup(){
  if(typeof firebase==='undefined' || !configLooksSet()){
    document.getElementById('fb-warn').innerHTML='<div class="setup-warn">⚙️ <b>Live multiplayer needs a free Firebase project.</b> Paste your <code>firebaseConfig</code> into the top of <code>host-game.html</code> and <code>play.html</code> (see the comment there), then reload. Until then, use the self-paced lesson links on the Hub.</div>';
  }
  const pick=document.getElementById('pick');
  pick.innerHTML=LESSONS.map(l=>`<div class="pcard" style="--pc:${l.color}" onclick="selectLesson(${l.id})" id="pc-${l.id}">
    <div class="pc-n">Lesson ${l.id}</div><div class="pc-t">${l.icon} ${l.title}</div><div class="pc-m">${l.draw} questions · ${DUR}s each</div></div>`).join('');
}
function selectLesson(id){
  selLesson=LESSONS.find(l=>l.id===id);
  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('sel'));
  document.getElementById('pc-'+id).classList.add('sel');
  document.getElementById('create-btn').disabled=false;
}

/* build fixed deck (same for everyone) */
function buildDeck(l){
  const picked=shuffle(l.questions).slice(0,l.draw);
  return picked.map(q=>{
    const opts=q.answers.map((t,i)=>({t,ok:i===q.correct}));
    const sh=shuffle(opts);
    return {q:q.q, ex:q.explanation, opts:sh.map(o=>o.t), correct:sh.findIndex(o=>o.ok)};
  });
}

async function createGame(){
  if(!selLesson){ toast('Pick a lesson first ☝️'); return; }
  const err=ensureFirebase();
  if(err){ alert(err); return; }
  const btn=document.getElementById('create-btn'); const label=btn.textContent;
  btn.disabled=true; btn.textContent='Creating…';
  try{
    pin=(''+Math.floor(100000+Math.random()*900000));
    const deck=buildDeck(selLesson);
    gameRef=db.ref('games/'+pin);
    await gameRef.set({
      lessonId:selLesson.id, title:selLesson.title, icon:selLesson.icon, color:selLesson.color,
      deck:deck, phase:'lobby', currentQ:-1, qStart:0, duration:DUR, players:{}, createdAt:Date.now()
    });
    gameRef.onDisconnect().remove();     // auto-clean when host leaves
    gameRef.on('value',s=>{game=s.val();onGame();});
    showLobby(deck.length);
  }catch(e){
    alert('Could not create the game: '+((e&&e.message)||e)+'\n\nCommon causes: the Realtime Database has not been created in the Firebase console, the databaseURL in your config is wrong, or the database rules are not in test mode.');
    btn.disabled=false; btn.textContent=label;
  }
}
function showLobby(n){
  document.getElementById('lobby-lesson').textContent=selLesson.icon+' Lesson '+selLesson.id;
  document.getElementById('lobby-sub').textContent=selLesson.title+' · '+n+' questions';
  document.getElementById('pin-big').textContent=pin;
  const playURL=new URL('popm-play.html',location.href).href+'?pin='+pin;
  document.getElementById('join-url').textContent=new URL('popm-play.html',location.href).href;
  const box=document.getElementById('qr-host');box.innerHTML='';
  try{ if(typeof QRCode!=='undefined'){ new QRCode(box,{text:playURL,width:180,height:180,colorDark:'#16213e',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M}); } else throw 0; }
  catch(e){ box.innerHTML='<img width="180" height="180" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(playURL)+'">'; }
  show('screen-lobby');
}

/* react to game state (host owns transitions but re-renders players/answers live) */
function onGame(){
  if(!game)return;
  const players=game.players||{};
  const names=Object.values(players);
  if(game.phase==='lobby'){
    document.getElementById('players-count').textContent=names.length?`${names.length} player${names.length!==1?'s':''} joined`:'Waiting for players…';
    document.getElementById('chips').innerHTML=names.map(p=>`<div class="chip">${esc(p.name)}</div>`).join('');
    document.getElementById('start-btn').disabled=names.length===0;
  }else if(game.phase==='question'){
    renderAnswered();
  }
}
function renderAnswered(){
  const players=game.players||{};const ids=Object.keys(players);
  const qi=game.currentQ;let ans=0;
  ids.forEach(id=>{const a=players[id].answers;if(a&&a[qi]!==undefined)ans++;});
  document.getElementById('q-answered').textContent=`${ans} / ${ids.length} answered`;
  if(ids.length>0 && ans>=ids.length && !revealed){ setTimeout(()=>doReveal(),400); }
}

async function startGame(){ await gotoQuestion(0); }
async function gotoQuestion(i){
  revealed=false;
  await gameRef.update({phase:'question',currentQ:i,qStart:Date.now(),duration:DUR});
  renderQuestion(i);
  startHostTimer();
}
function renderQuestion(i){
  const d=game.deck[i];const sh=['▲','●','■','◆'],cl=['A','B','C','D'];
  document.getElementById('q-idx').textContent=`Question ${i+1} / ${game.deck.length}`;
  document.getElementById('q-text').textContent=d.q;
  document.getElementById('q-tiles').innerHTML=d.opts.map((t,k)=>`<div class="tile ${cl[k]}"><span class="sh">${sh[k]}</span>${esc(t)}</div>`).join('');
  document.getElementById('q-answered').textContent='0 answered';
  show('screen-q');
}
function startHostTimer(){
  clearInterval(hostTimer);
  const el=document.getElementById('q-timer');
  function tick(){
    const left=Math.max(0,Math.ceil(DUR-(Date.now()-game.qStart)/1000));
    el.textContent=left;el.className='q-timer-circle'+(left<=5?' urgent':'');
    if(left<=0){clearInterval(hostTimer);doReveal();}
  }
  tick();hostTimer=setInterval(tick,300);
}

async function doReveal(){
  if(revealed)return;revealed=true;clearInterval(hostTimer);
  await gameRef.update({phase:'reveal'});
  renderReveal();
}
function renderReveal(){
  const i=game.currentQ,d=game.deck[i],players=game.players||{};const ids=Object.keys(players);
  const counts=[0,0,0,0];let correct=0,answered=0;
  ids.forEach(id=>{const a=players[id].answers;if(a&&a[i]!==undefined){answered++;counts[a[i].choice]++;if(a[i].ok)correct++;}});
  const rate=answered?Math.round(correct/answered*100):0;
  document.getElementById('rv-rate').textContent=rate+'%';
  document.getElementById('rv-sub').textContent=`answered correctly · ${correct} of ${answered}`;
  const sh=['▲','●','■','◆'],cl=['A','B','C','D'];const max=Math.max(1,...counts);
  document.getElementById('rv-bars').innerHTML='<div class="bars-title">How the room answered</div>'+d.opts.map((t,k)=>
    `<div class="bar-row ${k===d.correct?'correct':''}">
       <div class="bar-head">
         <div class="bar-sh ${cl[k]}">${sh[k]}</div>
         <div class="bar-label">${esc(t)}${k===d.correct?'<span class="ok">✓</span>':''}</div>
         <div class="bar-cnt">${counts[k]}</div>
       </div>
       <div class="bar-track"><div class="bar-fill ${cl[k]}" style="width:${counts[k]/max*100}%"></div></div>
     </div>`).join('');
  renderBoard('rv-board',5);
  const last=i>=game.deck.length-1;
  document.getElementById('next-btn').textContent=last?'See final podium →':'Next →';
  show('screen-reveal');
}
function sortedPlayers(){
  const players=game.players||{};
  return Object.keys(players).map(id=>({id,...players[id]})).sort((a,b)=>(b.score||0)-(a.score||0)||(a.joinedAt||0)-(b.joinedAt||0));
}
function renderBoard(elId,limit){
  const list=sortedPlayers().slice(0,limit||99);
  document.getElementById(elId).innerHTML=list.length?list.map((e,i)=>
    `<div class="lrow"><div class="rk">${i+1}</div><div class="rn">${esc(e.name)}</div><div class="rs">${(e.score||0).toLocaleString()}</div></div>`).join('')
    :'<div style="color:var(--muted);text-align:center;padding:1rem">No scores yet</div>';
}

async function nextQuestion(){
  const i=game.currentQ+1;
  if(i<game.deck.length){ await gotoQuestion(i); }
  else{ await gameRef.update({phase:'final'}); renderFinal(); }
}
function renderFinal(){
  const list=sortedPlayers();const top=list.slice(0,3);
  const order=[1,0,2],cls=['first','second','third'],md=['🥇','🥈','🥉'];
  document.getElementById('f-podium').innerHTML=top.length?order.map(idx=>{
    if(!top[idx])return '<div class="plat"></div>';const e=top[idx];
    return `<div class="plat ${cls[idx]}">${idx===0?'<div class="crown">👑</div>':''}<div class="p-av">${esc(e.name.charAt(0).toUpperCase())}</div><div class="p-nm">${esc(e.name)}</div><div class="p-sc">${(e.score||0).toLocaleString()} pts</div><div class="p-bl">${md[idx]}</div></div>`;
  }).join(''):'<div style="color:var(--muted)">No players</div>';
  document.getElementById('f-board').innerHTML=list.map((e,i)=>
    `<div class="lrow"><div class="rk">${i+1}</div><div class="rn">${esc(e.name)}</div><div class="rs">${(e.score||0).toLocaleString()}</div></div>`).join('');
  show('screen-final');
}

function cancelGame(){ if(gameRef){gameRef.remove();} location.reload(); }
window.addEventListener('beforeunload',()=>{if(gameRef)gameRef.remove();});
initSetup();
</script>
